name: Deploy Server

on:
   push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with: 
          context: .
          file: Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/tross-backend:${{ github.sha }}
          push: true

      - name: Fix Docker socket permissions
        run: sudo chmod 666 /var/run/docker.sock

      - name: Deploy to VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          chmod 700 /home/runner/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@65.1.248.25 -t "docker stop tross_backend && docker run --name tross_backend -d -p 3100:3100 ${{ secrets.DOCKER_USERNAME }}/tross-backend:${{ github.sha }}"
