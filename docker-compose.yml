services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-scraper-api
    ports:
      - "${PORT:-3100}:3100"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      NODE_ENV: production
      TLS_CERT_PATH: /app/certs/cert.pem
      TLS_KEY_PATH: /app/certs/key.pem
    restart: unless-stopped
